[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cast-ollama"
version = "0.1.0"
description = "cAST Efficient Ollama Demo"
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "tree-sitter>=0.20.0",
    "tree-sitter-python>=0.21.0",
    "pydantic>=2.0.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "chromadb>=0.5.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
ollama = ["ollama>=0.1.0"]
models = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "FlagEmbedding>=1.3.5",
]
oracle = ["oracledb>=2.0.0"]
full = [
    "ollama>=0.1.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "FlagEmbedding>=1.3.5",
    "oracledb>=2.0.0",
]

[project.scripts]
cast-ollama = "cast_ollama.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
