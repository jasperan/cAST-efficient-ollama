repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: detect-private-key

  - repo: local
    hooks:
      - id: block-generated-agent-docs
        name: Block generated agent/Codex markdown artifacts
        entry: python scripts/block_generated_docs.py
        language: system
        pass_filenames: true
